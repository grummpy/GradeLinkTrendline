[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gradelinktrendline"
version = "0.1.0"
description = "Local-first parser that turns school low-grade alert emails into per-subject trend charts."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "GradeLink Trendline contributors" }]
dependencies = ["pandas>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
glt = "gradelinktrendline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
